name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck \
            build.sh \
            jlesage/build-local.sh \
            jlesage/rootfs/startapp.sh \
            jlesage/rootfs/usr/local/bin/prepare-subtitleedit \
            scripts/*.sh

      - name: Validate source patches
        run: |
          git apply --numstat \
            jlesage/patches/avalonia-12.1.0-window-hints.patch
          git apply --numstat \
            jlesage/patches/subtitleedit-5.1.0.patch

      - name: Validate Unraid XML
        run: xmllint --noout unraid/my-subtitleedit.xml

      - name: Validate Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Dockerfile build checks
        run: |
          docker buildx build \
            --call=check \
            --file jlesage/Dockerfile \
            .
