services:
  subtitleedit-test:
    image: "${SUBTITLE_EDIT_IMAGE:-pegasbur/subtitleedit:latest}"
    container_name: subtitleedit-test
    environment:
      PUID: "99"
      PGID: "100"
      TZ: "Etc/UTC"
      TITLE: "Subtitle Edit Test"
      CUSTOM_USER: "subtitleedit"
      PASSWORD: "${SUBTITLE_EDIT_PASSWORD:?Set SUBTITLE_EDIT_PASSWORD in .env}"
      AUTO_GPU: "true"
      START_DOCKER: "false"
    volumes:
      - /mnt/user/appdata/subtitleedit-test:/config
      - /mnt/user/data:/data
    ports:
      - "${SUBTITLE_EDIT_HTTPS_PORT:-3101}:3001"
    shm_size: "1gb"
    restart: unless-stopped
