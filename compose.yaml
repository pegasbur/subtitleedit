services:
  subtitle-edit-test:
    image: "${SUBTITLE_EDIT_IMAGE:-pegasbur/subtitle-edit:latest}"
    container_name: subtitle-edit-test
    environment:
      PUID: "99"
      PGID: "100"
      TZ: "Europe/Zurich"
      TITLE: "Subtitle Edit Test"
      CUSTOM_USER: "subtitle-edit"
      PASSWORD: "${SUBTITLE_EDIT_PASSWORD:?Set SUBTITLE_EDIT_PASSWORD in .env}"
      AUTO_GPU: "true"
      START_DOCKER: "false"
    volumes:
      - /mnt/user/appdata/subtitle-edit-test:/config
      - /mnt/user/data:/data
    ports:
      - "${SUBTITLE_EDIT_HTTPS_PORT:-3101}:3001"
    shm_size: "1gb"
    restart: unless-stopped
