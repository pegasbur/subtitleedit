services:
  subtitleedit:
    image: "${SUBTITLE_EDIT_IMAGE:-ghcr.io/pegasbur/subtitleedit:latest}"
    container_name: "${SUBTITLE_EDIT_CONTAINER_NAME:-subtitleedit}"
    environment:
      USER_ID: "${USER_ID:-99}"
      GROUP_ID: "${GROUP_ID:-100}"
      TZ: "${TZ:-Etc/UTC}"
      WEB_AUDIO: "${WEB_AUDIO:-1}"
      WEB_HOST_CLIPBOARD_SYNC: "${WEB_HOST_CLIPBOARD_SYNC:-1}"
      WEB_FILE_MANAGER: "${WEB_FILE_MANAGER:-1}"
      WEB_FILE_MANAGER_ALLOWED_PATHS: "${WEB_FILE_MANAGER_ALLOWED_PATHS:-AUTO}"
      DARK_MODE: "${DARK_MODE:-0}"
      KEEP_APP_RUNNING: "${KEEP_APP_RUNNING:-1}"
      DISPLAY_WIDTH: "${DISPLAY_WIDTH:-1920}"
      DISPLAY_HEIGHT: "${DISPLAY_HEIGHT:-1080}"
      # Keep the internal port aligned with the mapping and image healthcheck.
      WEB_LISTENING_PORT: "5800"
      SECURE_CONNECTION: "${SECURE_CONNECTION:-0}"
      WEB_AUTHENTICATION: "${WEB_AUTHENTICATION:-0}"
      WEB_AUTHENTICATION_TOKEN_VALIDITY_TIME: "${WEB_AUTHENTICATION_TOKEN_VALIDITY_TIME:-24}"
      WEB_AUTHENTICATION_USERNAME: "${WEB_AUTHENTICATION_USERNAME:-}"
      WEB_AUTHENTICATION_PASSWORD: "${WEB_AUTHENTICATION_PASSWORD:-}"
    volumes:
      - "${SUBTITLE_EDIT_CONFIG_PATH:-/mnt/user/appdata/subtitleedit}:/config"
      - "${SUBTITLE_EDIT_DATA_PATH:-/mnt/user/data}:/data"
    ports:
      - "${SUBTITLE_EDIT_HTTP_PORT:-5800}:5800"
    shm_size: "1gb"
    restart: unless-stopped
