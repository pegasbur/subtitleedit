name: Publish stable image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve pinned versions and image tags
        id: versions
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source versions.env

          version_tag="${SUBTITLE_EDIT_STABLE_VERSION}-r${SUBTITLE_EDIT_JLESAGE_REVISION}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/subtitleedit"

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:${SUBTITLE_EDIT_STABLE_VERSION}"
            echo "${image}:${version_tag}"
            echo "EOF"
            echo "build_args<<EOF"
            echo "DOTNET_SDK_IMAGE=${DOTNET_SDK_IMAGE}"
            echo "BASE_IMAGE=${JLESAGE_IMAGE}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "VCS_REF=${GITHUB_SHA}"
            echo "IMAGE_REVISION=${SUBTITLE_EDIT_JLESAGE_REVISION}"
            echo "SUBTITLE_EDIT_VERSION=${SUBTITLE_EDIT_STABLE_VERSION}"
            echo "SUBTITLE_EDIT_COMMIT=${SUBTITLE_EDIT_STABLE_COMMIT}"
            echo "AVALONIA_VERSION=${AVALONIA_VERSION}"
            echo "AVALONIA_COMMIT=${AVALONIA_COMMIT}"
            echo "AVALONIA_X11_PACKAGE_VERSION=${AVALONIA_X11_PACKAGE_VERSION}"
            echo "AVALONIA_X11_NUPKG_SHA256=${AVALONIA_X11_NUPKG_SHA256}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: jlesage/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.versions.outputs.tags }}
          build-args: ${{ steps.versions.outputs.build_args }}
          cache-from: type=gha,scope=stable-jlesage
          cache-to: type=gha,mode=max,scope=stable-jlesage
          provenance: mode=max
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.versions.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
