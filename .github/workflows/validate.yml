name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck \
            build.sh \
            scripts/*.sh \
            root/defaults/autostart \
            root/defaults/autostart_wayland \
            root/usr/local/bin/prepare-subtitle-edit

      - name: Validate Unraid XML
        run: xmllint --noout unraid/my-subtitle-edit.xml

      - name: Validate Compose configuration
        env:
          SUBTITLE_EDIT_PASSWORD: validation-only
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Dockerfile build checks
        run: docker buildx build --call=check .
