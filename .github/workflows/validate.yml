name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck \
            build.sh \
            container/build-local.sh \
            container/rootfs/startapp.sh \
            container/rootfs/usr/local/bin/healthcheck \
            container/rootfs/usr/local/bin/prepare-subtitleedit

      - name: Validate source patch syntax
        run: |
          AVALONIA_VERSION="$(sed -n 's/^AVALONIA_VERSION=//p' versions.env)"
          test -n "$AVALONIA_VERSION"
          git apply --numstat \
            "container/patches/avalonia-${AVALONIA_VERSION}-window-hints.patch"
          git apply --numstat \
            container/patches/subtitleedit.patch

      - name: Validate Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Dockerfile build checks
        run: |
          docker buildx build \
            --call=check \
            --file container/Dockerfile \
            .
